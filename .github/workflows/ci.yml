name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Per-service build jobs — each builds independently for easier debugging
  # ---------------------------------------------------------------------------
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          target: production
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-landing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build landing
        uses: docker/build-push-action@v6
        with:
          context: ./landing
          file: ./landing/Dockerfile
          push: false
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

  build-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          build-args: |
            VITE_AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  build-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build admin
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: false
          build-args: |
            VITE_AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  build-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build migrations
        uses: docker/build-push-action@v6
        with:
          context: ./migrations
          file: ./migrations/Dockerfile
          push: false
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

  build-nginx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: false
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # ---------------------------------------------------------------------------
  # Test job — builds the test target and runs Go tests with DB
  # ---------------------------------------------------------------------------
  test:
    needs: [build-api, build-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Create CI secrets
        run: |
          mkdir -p secrets test-results
          echo -n "ci-test-password" > secrets/db_password.txt
          python3 -c "import os, base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode(), end='')" > secrets/encryption_key.txt
          openssl rand -base64 32 | tr -d '\n' > secrets/jwt_secret.txt
          echo -n "ci-placeholder" > secrets/auth0_client_secret.txt
          echo -n "ci-placeholder" > secrets/auth0_mgmt_client_secret.txt
          echo -n "ci@test.local" > secrets/integration_tests_auth0_email.txt
          echo -n "ci-password" > secrets/integration_tests_auth0_password.txt

      - name: Create CI .env
        run: |
          cat > .env <<EOF
          DB_USERNAME=postgres
          DB_NAME=budgets
          DB_HOSTNAME=db
          DB_PORT=5432
          DB_HOST_PORT=5432
          API_PORT=8080
          SERVER_ENV=test
          AUTH0_DOMAIN=ci.placeholder.auth0.com
          AUTH0_AUDIENCE=ci-audience
          AUTH0_CLIENT_ID=ci-client-id
          AUTH0_MGMT_CLIENT_ID=ci-mgmt-client-id
          AUTH0_DB_CONNECTION=Username-Password-Authentication
          SECRETS_PROVIDER=docker
          INTEGRATION_TESTS_BASE_URL=http://nginx
          INTEGRATION_TESTS_SCREENSHOTS_DIR=/tests/screenshots
          INTEGRATION_TESTS_SCREENSHOTS_HOST_DIR=./tests/screenshots
          INTEGRATION_TESTS_SECRETS_PROVIDER=docker
          DOCKER_REGISTRY_PREFIX=${{ github.repository }}
          IMAGE_TAG=ci
          NGINX_CONF=./nginx/nginx.dev.conf
          TLS_CERT_DIR=./nginx/ssl
          EOF

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          target: test
          tags: budgets-test:ci
          push: false
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=test

      - name: Build migrations image
        uses: docker/build-push-action@v6
        with:
          context: ./migrations
          file: ./migrations/Dockerfile
          tags: budgets-migrations:ci
          push: false
          load: true
          cache-from: type=gha,scope=migrations

      - name: Run Go tests (unit + integration with DB)
        run: docker compose --profile test run --rm test

      - name: Generate coverage summary
        if: always()
        run: |
          if [ -f test-results/coverage.out ]; then
            docker run --rm -v "$PWD/test-results:/results" golang:1.22-alpine \
              go tool cover -func=/results/coverage.out | tail -1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Go Test Results
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v
