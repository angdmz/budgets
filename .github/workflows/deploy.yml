name: Deploy

on:
  push:
    branches: [main]

# RACE CONDITION HANDLING:
# Only one deploy runs at a time. Subsequent merges queue (cancel-in-progress: false).
# This ensures migrations run sequentially and no half-deployed state occurs.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Per-service build & push jobs — each builds and pushes independently
  # ---------------------------------------------------------------------------
  build-and-push-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-and-push-landing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./landing
          file: ./landing/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/landing:${{ github.sha }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

  build-and-push-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          build-args: |
            VITE_AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  build-and-push-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/admin:${{ github.sha }}
          build-args: |
            VITE_AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  build-and-push-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./migrations
          file: ./migrations/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/migrations:${{ github.sha }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

  build-and-push-nginx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/nginx:${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  migrate:
    needs: [build-and-push-migrations]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run database migrations
        run: |
          echo "TODO: Pull and run migrations image against production DB."
          echo "  docker run --rm \\"
          echo "    -e DB_HOSTNAME=\${{ secrets.DB_HOSTNAME }} \\"
          echo "    -e DB_PORT=5432 \\"
          echo "    -e DB_USERNAME=\${{ secrets.DB_USERNAME }} \\"
          echo "    -e DB_NAME=\${{ secrets.DB_NAME }} \\"
          echo "    -e DB_PASSWORD=\${{ secrets.DB_PASSWORD }} \\"
          echo "    -e ENCRYPTION_KEY=\${{ secrets.ENCRYPTION_KEY }} \\"
          echo "    -e SECRETS_PROVIDER=env \\"
          echo "    ghcr.io/${{ github.repository }}/migrations:\${GITHUB_SHA} \\"
          echo "    alembic upgrade head"

  deploy:
    needs: [migrate, build-and-push-api, build-and-push-landing, build-and-push-app, build-and-push-admin, build-and-push-nginx]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy services
        run: |
          echo "TODO: Replace with actual deploy command. Examples:"
          echo "  - VPS: ssh deploy@host 'cd /app && docker compose pull && docker compose up -d'"
          echo "  - K8s: kubectl set image deployment/api api=ghcr.io/.../api:\${SHA}"
          echo "  - ECS: aws ecs update-service --force-new-deployment"
          echo ""
          echo "Deployed commit: ${{ github.sha }}"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          echo "TODO: curl --fail --retry 5 --retry-delay 10 https://your-domain.com/api/health"

      - name: Notify on failure
        if: failure()
        run: |
          echo "TODO: Send notification (Slack/Discord/email) on failed deploy."
