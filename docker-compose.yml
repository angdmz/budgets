services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - budget_network

  migrations:
    image: ghcr.io/${DOCKER_REGISTRY_PREFIX}/migrations:${IMAGE_TAG}
    build:
      context: ./migrations
      dockerfile: Dockerfile
    env_file: .env
    secrets:
      - db_password
      - encryption_key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - budget_network

  migrate-create:
    build:
      context: ./migrations
      dockerfile: Dockerfile
    entrypoint: ["alembic", "revision", "--autogenerate", "-m"]
    env_file: .env
    secrets:
      - db_password
      - encryption_key
    volumes:
      - ./migrations/versions:/app/versions
    depends_on:
      db:
        condition: service_healthy
    networks:
      - budget_network
    profiles:
      - tools

  migrate-downgrade:
    build:
      context: ./migrations
      dockerfile: Dockerfile
    entrypoint: ["alembic", "downgrade"]
    command: ["-1"]
    env_file: .env
    secrets:
      - db_password
      - encryption_key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - budget_network
    profiles:
      - tools

  migrate-history:
    build:
      context: ./migrations
      dockerfile: Dockerfile
    entrypoint: ["alembic", "history"]
    env_file: .env
    secrets:
      - db_password
      - encryption_key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - budget_network
    profiles:
      - tools

  api:
    image: ghcr.io/${DOCKER_REGISTRY_PREFIX}/api:${IMAGE_TAG}
    build:
      context: ./core
      dockerfile: Dockerfile
      target: production
    ports:
      - "${API_PORT}:8080"
    env_file: .env
    secrets:
      - db_password
      - encryption_key
      - jwt_secret
      - auth0_client_secret
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - budget_network

  landing:
    image: ghcr.io/${DOCKER_REGISTRY_PREFIX}/landing:${IMAGE_TAG}
    build:
      context: ./landing
      dockerfile: Dockerfile
    env_file: .env
    networks:
      - budget_network

  app:
    image: ghcr.io/${DOCKER_REGISTRY_PREFIX}/app:${IMAGE_TAG}
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    networks:
      - budget_network

  admin:
    image: ghcr.io/${DOCKER_REGISTRY_PREFIX}/admin:${IMAGE_TAG}
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    networks:
      - budget_network

  nginx:
    image: ghcr.io/${DOCKER_REGISTRY_PREFIX}/nginx:${IMAGE_TAG}
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8000:80"
      - "8443:443"
    depends_on:
      - api
      - landing
      - app
      - admin
    networks:
      - budget_network
    volumes:
      - ${NGINX_CONF}:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ${TLS_CERT_DIR}:/etc/nginx/ssl:ro

  test:
    build:
      context: ./core
      dockerfile: Dockerfile
      target: test
    volumes:
      - ./test-results:/tmp/test-results
    env_file: .env
    secrets:
      - db_password
      - encryption_key
      - jwt_secret
      - auth0_client_secret
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - budget_network
    profiles:
      - test

  integration-tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ${INTEGRATION_TESTS_SCREENSHOTS_HOST_DIR}:/tests/screenshots
    secrets:
      - integration_tests_auth0_email
      - integration_tests_auth0_password
      - auth0_mgmt_client_secret
    depends_on:
      - nginx
      - api
      - landing
      - app
      - admin
    networks:
      - budget_network
    profiles:
      - integration

  generate-db-password:
    image: alpine:latest
    command: sh -c "head -c 32 /dev/urandom | base64 | tr -d '\n' > /secrets/db_password.txt && echo 'Generated db_password.txt'"
    volumes:
      - ./secrets:/secrets
    profiles:
      - setup

  generate-encryption-key:
    image: python:3.13-slim
    command: sh -c "pip install -q cryptography && python -c \"from cryptography.fernet import Fernet; import sys; sys.stdout.write(Fernet.generate_key().decode())\" > /secrets/encryption_key.txt && echo 'Generated encryption_key.txt'"
    volumes:
      - ./secrets:/secrets
    profiles:
      - setup

  generate-jwt-secret:
    image: alpine:latest
    command: sh -c "head -c 32 /dev/urandom | base64 | tr -d '\n' > /secrets/jwt_secret.txt && echo 'Generated jwt_secret.txt'"
    volumes:
      - ./secrets:/secrets
    profiles:
      - setup

  generate-auth0-client-secret:
    image: alpine:latest
    command: sh -c "echo -n 'your-auth0-client-secret-here' > /secrets/auth0_client_secret.txt && echo 'Generated auth0_client_secret.txt (placeholder - replace with real Auth0 client secret)'"
    volumes:
      - ./secrets:/secrets
    profiles:
      - setup

  generate-auth0-mgmt-client-secret:
    image: alpine:latest
    command: sh -c "echo -n 'your-auth0-mgmt-client-secret-here' > /secrets/auth0_mgmt_client_secret.txt && echo 'Generated auth0_mgmt_client_secret.txt (placeholder - replace with real Auth0 M2M client secret)'"
    volumes:
      - ./secrets:/secrets
    profiles:
      - setup

  generate-integration-test-secrets:
    image: alpine:latest
    command: sh -c "echo -n 'test@example.com' > /secrets/integration_tests_auth0_email.txt && echo -n 'changeme' > /secrets/integration_tests_auth0_password.txt && echo 'Generated integration test secrets (placeholders - replace with real values)'"
    volumes:
      - ./secrets:/secrets
    profiles:
      - setup

  go-mod-tidy:
    image: golang:1.22-alpine
    working_dir: /app
    command: sh -c "go mod tidy && cat go.sum"
    volumes:
      - ./core:/app
    profiles:
      - tools

secrets:
  db_password:
    file: ./secrets/db_password.txt
  encryption_key:
    file: ./secrets/encryption_key.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  auth0_client_secret:
    file: ./secrets/auth0_client_secret.txt
  auth0_mgmt_client_secret:
    file: ./secrets/auth0_mgmt_client_secret.txt
  integration_tests_auth0_email:
    file: ./secrets/integration_tests_auth0_email.txt
  integration_tests_auth0_password:
    file: ./secrets/integration_tests_auth0_password.txt

volumes:
  db_data:

networks:
  budget_network:
    driver: bridge